name: ✨ Feature request
description: Suggest an idea for mahdicpy
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Web panel, Developer toolkit, CLI, Installer, Docs]
