name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Python syntax
        run: python -m py_compile mahdicpy web/server.py
      - name: CLI smoke test
        run: python mahdicpy help && python mahdicpy otg --dry-run
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: Shell syntax
        run: bash -n install.sh
